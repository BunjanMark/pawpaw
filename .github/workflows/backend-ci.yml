name: Backend CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PawPaw.slnx

      - name: Build
        run: dotnet build PawPaw.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PawPaw.slnx --configuration Release --no-build
